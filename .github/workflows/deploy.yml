name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

# Allow one concurrent deploy; cancel in-flight runs on new push.
concurrency:
  group: gh-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # peaceiris/actions-gh-pages needs write to push gh-pages branch

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: .
          # Exclude non-web files from the published branch.
          exclude_assets: >-
            .github,
            agent-reference,
            firestore.rules,
            firestore.indexes.json,
            storage.rules,
            README.md
